[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [
  { name="ecallisa", email="ecallisa@student.42sp.org.br" },
  { name="eguedes-", email="eguedes-@student.42sp.org.br"},
]
description = "A professional and reusable maze generator."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools]
packages = ["mazegen"]
